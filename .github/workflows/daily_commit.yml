name: Daily Auto Commit

on:
  schedule:
    - cron: "0 18 * * *"  # runs daily at 11:30 PM IST (18:00 UTC)
  workflow_dispatch:       # manual trigger from Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update daily log
        run: |
          mkdir -p .daily
          echo "Last auto-updated: $(date '+%Y-%m-%d %H:%M:%S UTC')" > .daily/heartbeat.txt
          echo "Day $(($(date +%j))) of $(date +%Y)" >> .daily/heartbeat.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .daily/heartbeat.txt
          git diff --staged --quiet || git commit -m "chore: daily update $(date '+%Y-%m-%d')"
          git push
